framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # the tasks of the worker (messenger:consume async): a table of PostgreSQL, the worker woken at once by
            # LISTEN/NOTIFY (use_notify)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                    # a message whose worker was killed while handling it is handled again after 5 minutes (1 hour by
                    # default)
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
#            sync: 'sync://'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # the tasks of the worker (src/Task)
            App\Task\TaskInterface: async

        default_bus: default.bus

        buses:
            default.bus:
                middleware:
                    # once the message is handled, the house bot may have something to do in its game
                    - 'App\Middleware\HouseBotMiddleware'
                    # values of the message (constraints of the Validator), before any lock or transaction
                    - validation
                    # after the commit
                    - 'App\Middleware\GameUpdatedNotificationMiddleware'
                    - doctrine_transaction
                    - 'App\Middleware\GameLockMiddleware'
                    - 'App\Middleware\GameVersionMiddleware'
                    - 'App\Middleware\GameEndedMiddleware'
                    # increments the version once the automatic transitions are applied: the log entries they write
                    # belong to the version of the message that led to them
                    - 'App\Middleware\EventRecordingMiddleware'
                    - 'App\Middleware\WorkflowTransitionMiddleware'
                    # right after the handling, before the automatic transitions: the provinces dynasty cards have left,
                    # once nothing is being resolved
                    - 'App\Middleware\ProvinceRefillMiddleware'
            # bus without middlewares to use in the message handlers
            transition.bus:
            # the tasks of the worker (src/Task), sent to the transport async: none of the middlewares of the actions,
            # whose transaction would hold the lock of a game for the whole task (a task dispatches actions on
            # default.bus)
            task.bus:
                middleware:
                    # the worker runs for an hour: its connection may have been closed meanwhile
                    - doctrine_ping_connection

when@test:
    framework:
        messenger:
            # the tasks are not handled in the tests: a test reads what was sent (InMemoryTransport) and invokes the
            # handler of the task
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
