# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    handle_all_throwables: true

    # the proxies in front of the application (Cloudflare in production, symfony.env): the address of the client is read
    # from X-Forwarded-For when the request comes from one of them (the limits of the sign-in by IP); none by default
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    http_client:
        scoped_clients:
            # the decks of EmeraldDB, imported from their URL (EmeraldDbDeckFetcher)
            emeralddb.client:
                base_uri: 'https://www.emeralddb.org'
                headers: { Accept: 'application/json' }
                timeout: 10
                max_redirects: 0

    serializer:
        name_converter: 'serializer.name_converter.camel_case_to_snake_case'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
