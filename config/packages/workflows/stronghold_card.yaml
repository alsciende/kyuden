framework:
    workflows:
        stronghold_card:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'currentPlace'
            supports:
                - App\Entity\CardTypes\StrongholdCard
            initial_marking: !php/const App\Entity\CardTypes\StrongholdCard::STATE_IN_PLAY
            places:
                - !php/const App\Entity\CardTypes\StrongholdCard::STATE_IN_PLAY
            transitions:
                noop:
                    from: !php/const App\Entity\CardTypes\StrongholdCard::STATE_IN_PLAY
                    to: !php/const App\Entity\CardTypes\StrongholdCard::STATE_IN_PLAY
