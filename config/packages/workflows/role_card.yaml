framework:
    workflows:
        role_card:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'currentPlace'
            supports:
                - App\Entity\CardTypes\RoleCard
            initial_marking: !php/const App\Entity\CardTypes\RoleCard::STATE_IN_PLAY
            places:
                - !php/const App\Entity\CardTypes\RoleCard::STATE_IN_PLAY
            transitions:
                noop:
                    from: !php/const App\Entity\CardTypes\RoleCard::STATE_IN_PLAY
                    to: !php/const App\Entity\CardTypes\RoleCard::STATE_IN_PLAY
