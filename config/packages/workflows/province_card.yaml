framework:
    workflows:
        province_card:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'currentPlace'
            supports:
                - App\Entity\CardTypes\ProvinceCard
            initial_marking: !php/const App\Entity\CardTypes\ProvinceCard::STATE_FACEDOWN
            places:
                - !php/const App\Entity\CardTypes\ProvinceCard::STATE_FACEDOWN
                - !php/const App\Entity\CardTypes\ProvinceCard::STATE_UNBROKEN
                - !php/const App\Entity\CardTypes\ProvinceCard::STATE_BROKEN
            transitions:
                reveal:
                    from: !php/const App\Entity\CardTypes\ProvinceCard::STATE_FACEDOWN
                    to: !php/const App\Entity\CardTypes\ProvinceCard::STATE_UNBROKEN
                unreveal:
                    from: !php/const App\Entity\CardTypes\ProvinceCard::STATE_UNBROKEN
                    to: !php/const App\Entity\CardTypes\ProvinceCard::STATE_FACEDOWN
                break:
                    from: !php/const App\Entity\CardTypes\ProvinceCard::STATE_UNBROKEN
                    to: !php/const App\Entity\CardTypes\ProvinceCard::STATE_BROKEN
                restore:
                    from: !php/const App\Entity\CardTypes\ProvinceCard::STATE_BROKEN
                    to: !php/const App\Entity\CardTypes\ProvinceCard::STATE_UNBROKEN

