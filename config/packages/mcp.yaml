mcp:
    servers:
        l5r:
            description: 'Play Legend of the Five Rings LCG (Stronghold format) against another player.'
            instructions: |
                The engine is a board: it enforces the flow of the game (rounds, phases, steps), not the rules of the
                cards. Each action is a tool named after its type (pass_opportunity, lose_honor…), sent as your
                player in the game; pass the version you saw as expected_version so that an action on a game that
                has changed since is rejected. Wait for your opponent with wait_for_update, which returns the log of
                the game since the version you know.
            transports:
                http: true
                stdio: false
            http:
                # under the firewall of the API: a bot authenticates with its API key (Authorization: Bearer)
                path: /api/mcp
            registry:
                tools: ['App\Mcp\']
