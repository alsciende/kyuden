security:
    # the players sign in with a username and a password (POST /api/sessions), which gives them an access token
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/(css|images|js)/
            security: false
        main:
            # the users authenticate with an access token (App\Entity\AccessToken); the password only gets a token
            access_token:
                token_handler: App\Security\AccessTokenHandler
            lazy: true
            stateless: true
            provider: app_user_provider

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # the catalogue of the action messages depends on no game
        - { path: ^/api/actions$, roles: PUBLIC_ACCESS }
        # the cards as printed depend on no game
        - { path: ^/api/cards(/|$), roles: PUBLIC_ACCESS }
        # anyone gets a guest account to try the game
        - { path: ^/api/guests$, roles: PUBLIC_ACCESS }
        # anyone creates an account (a guest keeps theirs by sending its token) and signs in
        - { path: ^/api/accounts$, roles: PUBLIC_ACCESS }
        - { path: ^/api/sessions$, roles: PUBLIC_ACCESS }
        # signing in with a provider of identities (OAuth2); linking an account checks its token in the controller
        - { path: ^/api/oauth/, roles: PUBLIC_ACCESS }
        # anyone with the code of an invitation reads who invites and whether it can be used
        - { path: ^/api/invitations/, roles: PUBLIC_ACCESS, methods: [GET] }
        # the MCP server is for the programs playing as a bot
        - { path: ^/api/mcp$, roles: ROLE_BOT }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        # hashing is slow on purpose: as fast as possible in the tests
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
