# the production stack, from the root of the repository:
#   docker compose -f docker/production/compose.yaml --env-file docker/production/.env up --build --detach
# the site listens on HTTP_PORT (80 by default), behind the proxy that terminates TLS
name: kyuden

x-app-environment: &app-environment
  APP_SECRET: ${APP_SECRET:?}
  DATABASE_URL: postgresql://${POSTGRES_USER:-kyuden}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:-kyuden}?serverVersion=18&charset=utf8
  # the hub as php reaches it in the Docker network; the browsers reach it through nginx, on the origin of the site
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${SITE_URL:?}/.well-known/mercure
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?}
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MAILER_DSN: ${MAILER_DSN:-null://null}
  HOUSE_BOT_ID: ${HOUSE_BOT_ID:-kyuden-bot}

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyuden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-kyuden}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-kyuden} -d ${POSTGRES_DB:-kyuden}
      interval: 10s
      timeout: 3s
      retries: 3

  php:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: php
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
    depends_on:
      - php
      - mercure

  mercure:
    image: dunglas/mercure:v0.24
    restart: unless-stopped
    environment:
      # plain HTTP behind nginx
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?}
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  database_data:
  mercure_data:
  mercure_config:
