server {
    listen 80;
    root /var/www/html/public;
    server_tokens off;

    # the web client (front/dist): an unknown path is a route of the client
    location / {
        try_files $uri /index.html;
    }

    # the files built by Vite and AssetMapper carry a hash in their name
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /bundles/ {
        try_files $uri =404;
    }

    # Symfony: the API and the development console
    location ~ ^/(api|console)(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # a long-poll on the log of a game waits up to 30 seconds
        fastcgi_read_timeout 60s;
    }

    # the Mercure hub, on the same origin as the site (MERCURE_PUBLIC_URL)
    location /.well-known/mercure {
        proxy_pass http://mercure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the updates are streamed (server-sent events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location ~ \.php$ {
        return 404;
    }
}
