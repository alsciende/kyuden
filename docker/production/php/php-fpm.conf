[www]
; the configuration comes from the environment of the container
clear_env = no
; a long-poll on the log of a game holds a worker while it waits (up to 30 seconds): enough workers for the other
; requests to be handled meanwhile
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
