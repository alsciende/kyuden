# the hot module replacement of Vite goes through a WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /var/www/html/public;

    # the web client (front/), served by the Vite development server of the node service
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Symfony: the API, the development console, its assets (AssetMapper) and the profiler
    location ~ ^/(api|console|assets|bundles|_wdt|_profiler)(/|$) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass symfony:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # a long-poll on the log of a game waits up to 30 seconds
        fastcgi_read_timeout 60s;
        internal;
    }

    # only the front controller is executed
    location ~ \.php$ {
        return 404;
    }
}
