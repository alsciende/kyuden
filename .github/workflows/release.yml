# every tag, on any branch: the tests and the linters (test.yml), then the production images
# (docker/production/Dockerfile) pushed to the GitHub Container Registry, tagged with the name of the git tag
name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # CODECOV_TOKEN
    secrets: inherit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [php, nginx]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kyuden-${{ matrix.target }}
          tags: type=ref,event=tag
          flavor: latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
