# every tag, on any branch: the tests and the linters (test.yml), then the production image
# (docker/production/Dockerfile) pushed to the GitHub Container Registry, tagged with the name of the git tag;
# a tag vX.Y.Z of a commit of main is then deployed to the production host (environment production, README "Production")
name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # CODECOV_TOKEN
    secrets: inherit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kyuden-app
          tags: type=ref,event=tag
          flavor: latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            KYUDEN_VERSION=${{ github.ref_name }}
            DISCORD_URL=${{ vars.DISCORD_URL }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # whether the tag is deployed: vX.Y.Z, on a commit of main
  deployable:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::$GITHUB_REF_NAME will be deployed: vX.Y.Z, on main"
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF_NAME is not deployed: not vX.Y.Z, or not on main"
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

  # the forced command of the key on the host (docker/production/deploy.sh) deploys the tag sent
  deploy:
    needs: [build, deployable]
    if: needs.deployable.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "$GITHUB_REF_NAME"

      # the entrypoint runs the migrations before serving anything
      - name: Check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 5 --retry-all-errors "$DEPLOY_URL/api/actions"
