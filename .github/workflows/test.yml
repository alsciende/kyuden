# every commit pushed, on any branch: the linters and the tests on the development stack; also the first job of a
# release (release.yml)
name: Test

on:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

# a new commit on a branch cancels the run of the previous one
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # make: no terminal for docker compose exec
      CI: true
      # the name of the image of the symfony service: kyuden-symfony
      COMPOSE_PROJECT_NAME: kyuden
    steps:
      - uses: actions/checkout@v7

      # the dependencies as installed by the last run with the same lock files: composer and importmap:install only
      # run their scripts
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            assets/vendor
          key: php-${{ runner.os }}-${{ hashFiles('composer.lock', 'importmap.php') }}

      - uses: actions/cache@v6
        with:
          path: front/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}

      # the symfony container runs as www-data and writes vendor/ and var/ in the checkout of the runner; var/ must
      # exist beforehand, else Docker creates it as root to mount the tmpfs of var/cache
      - name: Open the checkout to the containers
        run: mkdir -p var/log && chmod -R a+rwX .

      # the image of the symfony service, built from the cache of GitHub Actions: compose uses it instead of building it
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev/symfony/Dockerfile
          tags: kyuden-symfony
          load: true
          cache-from: type=gha,scope=dev-symfony
          cache-to: type=gha,mode=max,scope=dev-symfony

      - name: Start the databases
        run: docker compose up --detach --wait database database_test

      - name: Install the PHP dependencies
        run: docker compose run --rm --no-deps --entrypoint composer symfony install --no-interaction --no-progress

      - name: Start the application
        run: docker compose up --detach symfony

      - name: Install the dependencies of the web client
        run: make front-install

      - run: make lint
      - run: make db-test
      - run: make test
