services:
  database:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
#    volumes:
#      - database_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer
    ports:
      - 8081:8080

  symfony:
    build:
      context: .
      dockerfile: ./docker/dev/symfony/Dockerfile
    volumes:
      - .:/var/www/html
    # the Symfony cache (including the Doctrine second-level cache pool) lives in memory
    # rather than on the slow bind mount; it is emptied when the container restarts
    tmpfs:
      - /var/www/html/var/cache:uid=82,gid=82,mode=0755,size=512m
    ports:
      - 8080:8000
    user: www-data
    depends_on:
      database:
        condition: service_healthy
    entrypoint: '/var/www/html/docker/dev/symfony/entrypoint.sh'

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    ports:
      - "10001:80"

volumes:
  database_data:
  mercure_data:
  mercure_config:
