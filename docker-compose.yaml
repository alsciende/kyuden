services:
  database:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
#    volumes:
#      - database_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 3

  # the database of the tests (APP_ENV=test, .env.test), in memory: "make db-test" creates its schema and loads the fixtures
  database_test:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer
    ports:
      - 8081:8080

  symfony:
    build:
      context: .
      dockerfile: ./docker/dev/symfony/Dockerfile
    # the Symfony cache (including the Doctrine second-level cache pool) lives in memory
    # rather than on the slow bind mount; it is emptied when the container restarts
    tmpfs:
      - /var/www/html/var/cache:uid=82,gid=82,mode=0755,size=512m
    user: www-data
    environment:
      # the key of the tokens of the Mercure hub (Caddyfile), the MERCURE_JWT_SECRET of Symfony (.env)
      MERCURE_JWT_SECRET: '!ChangeThisMercureHubJWTSecretKey!'
    # FrankenPHP: Symfony, the Mercure hub and the web client (sent to the node service)
    ports:
      - 8080:80
    volumes:
      - .:/var/www/html
      # the history of the Mercure hub
      - caddy_data:/data/caddy
    depends_on:
      database:
        condition: service_healthy
      database_test:
        condition: service_healthy
    entrypoint: '/var/www/html/docker/dev/symfony/entrypoint.sh'

  # the web client (front/): the Vite development server, behind FrankenPHP (symfony service)
  node:
    image: node:24-alpine
    working_dir: /app/front
    volumes:
      - .:/app
    env_file:
      - path: proxy.env
        required: false
    command: sh -c 'npm install && npm run dev'

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
  caddy_data:
