services:
  database:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
#    volumes:
#      - database_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 3

  # the database of the tests (APP_ENV=test, .env.test), in memory: "make db-test" creates its schema and loads the fixtures
  database_test:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer
    ports:
      - 8081:8080

  symfony:
    build:
      context: .
      dockerfile: ./docker/dev/symfony/Dockerfile
    volumes:
      - .:/var/www/html
    # the Symfony cache (including the Doctrine second-level cache pool) lives in memory
    # rather than on the slow bind mount; it is emptied when the container restarts
    tmpfs:
      - /var/www/html/var/cache:uid=82,gid=82,mode=0755,size=512m
    user: www-data
    environment:
      # the hub as the symfony container reaches it in the Docker network (the browser uses MERCURE_PUBLIC_URL)
      MERCURE_URL: http://mercure/.well-known/mercure
    depends_on:
      database:
        condition: service_healthy
      database_test:
        condition: service_healthy
    entrypoint: '/var/www/html/docker/dev/symfony/entrypoint.sh'

  nginx:
    image: nginx:alpine
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80
    depends_on:
      - symfony
      - node

  # the web client (front/): the Vite development server, behind nginx
  node:
    image: node:24-alpine
    working_dir: /app/front
    volumes:
      - .:/app
    env_file:
      - path: proxy.env
        required: false
    command: sh -c 'npm install && npm run dev'

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  mercure:
    image: dunglas/mercure:v0.24
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # the URLs of the Symfony project (without trailing slash!); the topics are public: anonymous subscribers
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080 http://127.0.0.1:8080
        anonymous
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    ports:
      - "10001:80"

volumes:
  database_data:
  mercure_data:
  mercure_config:
